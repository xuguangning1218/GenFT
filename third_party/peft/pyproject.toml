[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peft-genft"
version = "0.15.2.dev0"
description = "A lightweight PEFT fork with GenFT support."
requires-python = ">=3.8"
dependencies = [
    "accelerate",
    "huggingface-hub",
    "numpy",
    "packaging",
    "psutil",
    "pyyaml",
    "safetensors",
    "torch",
    "tqdm",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

